<section class="page-head" style="border:0">
  <div class="wrap">
    <p class="label">Anfrage gesendet</p>
    <h1 class="page-title">Danke. <span class="accent">Wir melden uns.</span></h1>
    <p class="lead">Ihre Anfrage ist bei uns angekommen. Wir melden uns per Telefon oder E-Mail bei Ihnen. Wenn es brennt – zum Beispiel, weil es durchs Dach regnet – rufen Sie uns bitte direkt an.</p>
    <div class="btn-row" style="margin-top:28px">
      <a class="btn btn--primary" href="tel:{{site.phoneMobileHref}}">Anrufen: {{site.phoneMobile}}</a>
      <a class="btn" href="/">Zur Startseite</a>
    </div>
  </div>
</section>
<div class="wrap" style="padding-bottom:var(--section)"><div class="ruler" data-reveal aria-hidden="true"></div></div>
